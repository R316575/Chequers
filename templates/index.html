<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEA Online Draughts</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; }
        #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); width: 480px; margin: 20px auto; border: 4px solid #fff; }
        .square { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .light { background: #f0d9b5; }
        .dark { background: #b58863; }
        .piece { width: 45px; height: 45px; border-radius: 50%; box-sizing: border-box; }
        .red-piece { background: #cc0000; border: 2px solid #fff; }
        .white-piece { background: #ffffff; border: 2px solid #000; }
        .red-king { background: #cc0000; border: 5px double #ffd700; }
        .white-king { background: #ffffff; border: 5px double #ffd700; }
        .selected { outline: 3px solid #00ff00; outline-offset: -3px; }
        #controls { margin-bottom: 10px; }
        input { padding: 5px; font-size: 16px; }
        button { padding: 6px 12px; font-size: 16px; cursor: pointer; }
    </style>
    <!-- CHANGED: Loads Socket.IO directly from your local python server instead of the web -->
    <script src="https://socketio.io"></script>
</head>
<body>

    <h1>Online Draughts</h1>
    
    <div id="controls">
        <input type="text" id="roomCode" placeholder="Enter Room Code (e.g. 123)">
        <select id="playerColor">
            <option value="R">Red (Player 1)</option>
            <option value="W">White (Player 2)</option>
        </select>
        <button onclick="joinGame()">Join/Create Game</button>
    </div>

    <h3 id="turnIndicator">Connect to a room to start</h3>
    <div id="board"></div>

    <script>
        // Initialize the network socket connection FIRST
        const socket = io();

        // Declare the remaining state variables afterwards
        let currentRoom = "";
        let globalPlayerColor = "";
        let selectedSquare = null; 

        function joinGame() {
            const roomInput = document.getElementById('roomCode').value;
            const colorInput = document.getElementById('playerColor').value;
            
            if (!roomInput) {
                alert("Please enter a room code!");
                return;
            }
            
            // FIXED: Clean assignments now that variables are properly initialized
            currentRoom = roomInput;
            globalPlayerColor = colorInput;
            
            document.getElementById('controls').style.display = 'none';
            document.getElementById('turnIndicator').innerText = `Joined Room: ${currentRoom} | You are ${globalPlayerColor === 'R' ? 'Red' : 'White'}`;
            
            // Send connection event code to python server
            socket.emit('join_match', { room: currentRoom });
        }

        // Listen for the server updating the board matrix array
        socket.on('sync_board', function(data) {
            renderBoard(data.board);
        });

        // Listen for error messages from your python rules logic
        socket.on('error_msg', function(data) {
            alert(data.message);
            selectedSquare = null;
            const squares = document.querySelectorAll('.square');
            squares.forEach(s => s.classList.remove('selected'));
        });

        function renderBoard(matrix) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = ''; 

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    
                    const pieceValue = matrix[r][c];
                    if (pieceValue !== ' ') {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        if (pieceValue === 'r') piece.classList.add('red-piece');
                        if (pieceValue === 'R') piece.classList.add('red-king');
                        if (pieceValue === 'w') piece.classList.add('white-piece');
                        if (pieceValue === 'W') piece.classList.add('white-king');
                        square.appendChild(piece);
                    }

                    square.onclick = function() {
                        handleSquareClick(r, c);
                        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                            square.classList.add('selected');
                        }
                    };

                    boardDiv.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (!currentRoom) return;

            const squares = document.querySelectorAll('.square');
            squares.forEach(s => s.classList.remove('selected'));

            if (selectedSquare === null) {
                selectedSquare = { r: r, c: c };
            } else {
                const moveData = {
                    room: currentRoom,
                    player: globalPlayerColor,
                    r: selectedSquare.r,
                    c: selectedSquare.c,
                    nr: r,
                    nc: c
                };
                
                socket.emit('player_click_move', moveData);
                selectedSquare = null; 
            }
        }
    </script>
</body>
</html>
